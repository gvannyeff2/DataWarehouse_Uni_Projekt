version: "3.8"

services:
  db:
    image: postgres:15
    container_name: db_auto
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  etl_cron:
    build: .
    container_name: etl_cron
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DB_HOST=db
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - URL_DIABETES=${URL_DIABETES}
      - URL_GESUNDHEIT=${URL_GESUNDHEIT}

volumes:
  postgres_data:

